<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/readxiv-logo-r-monogram.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadXiv</title>
    <!-- Apply persisted visual settings before React mounts to avoid a theme/font flash. -->
    <script>
      (function() {
        var settings = {};
        try {
          settings = JSON.parse(localStorage.getItem('papyrus-settings') || '{}') || {};
        } catch (e) {}

        var themes = ['monochrome', 'olive', 'umber'];
        var fonts = ['dm-sans', 'fraunces'];
        var notesFonts = ['current', 'source-sans-3', 'atkinson-hyperlegible'];

        document.documentElement.setAttribute(
          'data-theme',
          themes.indexOf(settings.theme) >= 0 ? settings.theme : 'monochrome'
        );
        document.documentElement.setAttribute(
          'data-font',
          fonts.indexOf(settings.fontFamily) >= 0 ? settings.fontFamily : 'dm-sans'
        );
        document.documentElement.setAttribute(
          'data-notes-font',
          notesFonts.indexOf(settings.notesFontFamily) >= 0 ? settings.notesFontFamily : 'current'
        );
      })();
    </script>
  </head>
  <body style="background-color: #17181c">
    <div id="root"></div>
    <!-- MathJax is loaded on demand from Notes preview (see utils/mathjax.js) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
