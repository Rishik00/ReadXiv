<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 Command palette · ReadXiv</title><link rel="stylesheet" href="style.css" /></head>
<body data-variant="palette">
  <header class="topbar"><a class="brand" href="index.html">ReadXiv<span class="brand-dot">.</span></a><nav class="study-nav" aria-label="Study navigation"><a href="01-direct.html">01</a><a href="02-workspace.html">02</a><a aria-current="page" href="03-palette.html">03</a><a href="04-composer.html">04</a></nav><span class="top-note">Command palette</span></header>
  <main class="palette-main"><div class="palette-heading"><p class="kicker">Home</p><h1>A clear desk for<br><em>the next thought.</em></h1></div><button class="palette-trigger" type="button" data-palette-open><span>⌕</span><strong>Search, open, or add a paper</strong><kbd>⌘ K</kbd></button><div class="palette-links"><button type="button" data-palette-mode="search">Search library</button><button type="button" data-palette-mode="add">Add from link</button><button type="button" data-upload>Upload PDF</button></div></main>
  <div class="palette-overlay" data-palette-overlay hidden><div class="palette-dialog" role="dialog" aria-modal="true" aria-label="Paper commands"><form class="palette-form" data-action="smart"><span aria-hidden="true">⌕</span><label class="sr-only" for="palette-input">Search or enter a command</label><input id="palette-input" data-main-input autocomplete="off" placeholder="Search papers or choose an action…" /><button type="button" data-palette-close aria-label="Close palette">Esc</button></form><div class="palette-results result-panel" data-results></div><div class="palette-footer"><span>↑↓ Navigate</span><span>↵ Select</span><span>Esc Close</span></div></div></div>
  <input type="file" accept=".pdf,application/pdf" data-file hidden><div class="toast" role="status" aria-live="polite"></div><script src="app.js"></script>
</body></html>
